<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacta con Frutería del Día.">
    <title>Frutería del Día | Contacto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">

</head>
<body class="bg-slate-50 font-['Roboto'] text-slate-800 transition-colors duration-300">
    <header class="bg-white px-4 py-5 transition-colors duration-300">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4">
            <a href="index.html#inicio" class="text-2xl font-bold text-orange-800 sm:text-3xl">
                Frutería del Día
            </a>
            <button
                id="modoOscuroBtn"
                type="button"
                aria-label="Activar o desactivar modo oscuro"
                class="h-10 w-10 rounded-full bg-slate-800 text-white transition hover:bg-slate-700">
                🌙
            </button>
        </div>
    </header>

    <nav class="sticky top-0 z-50 bg-orange-100 shadow-md transition-colors duration-300" aria-label="Navegación principal">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-center gap-2 px-4 py-3 sm:justify-start">
            <a href="index.html#inicio" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-orange-200">Inicio</a>
            <a href="index.html#galeria-frutas" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-orange-200">Frutas</a>
            <a href="index.html#temporada" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-orange-200">Temporada</a>
            <a href="carrito.html" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-orange-200">Carrito <span id="contadorCarrito" class="ml-1 rounded-full bg-orange-600 px-2 py-0.5 text-xs font-bold text-white">0</span></a>
            <a href="contacto.html" aria-current="page" class="rounded-lg bg-orange-600 px-3 py-2 text-sm font-bold text-white">Contacto</a>
        </div>
    </nav>

    <main class="mx-auto max-w-3xl px-4 py-10 sm:px-6 sm:py-14">
        <section class="rounded-3xl border border-orange-100 bg-white p-6 shadow-sm sm:p-10">
            <p class="text-sm font-bold uppercase tracking-widest text-orange-700">
                Estamos para ayudarte
            </p>
            <h1 class="mt-2 text-3xl font-bold text-slate-900 sm:text-4xl">
                Contacto
            </h1>
            <p class="mt-3 leading-7 text-slate-600">
                Completa el formulario para dejarnos tu consulta.
            </p>

            <form id="formularioContacto" class="mt-8 space-y-5" novalidate>
                <div>
                    <label for="nombre" class="mb-2 block text-sm font-semibold text-slate-700">
                        Nombre
                    </label>
                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        autocomplete="name"
                        required
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
                </div>

                <div>
                    <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">
                        Correo electrónico
                    </label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
                </div>

                <div>
                    <label for="numero" class="mb-2 block text-sm font-semibold text-slate-700">
                        Número de teléfono
                    </label>
                    <input
                        id="numero"
                        name="numero"
                        type="tel"
                        autocomplete="tel"
                        required
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
                </div>

                <div>
                    <label for="motivo" class="mb-2 block text-sm font-semibold text-slate-700">
                        Motivo de contacto
                    </label>
                    <select
                        id="motivo"
                        name="motivo"
                        required
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-200">
                        <option value="" selected disabled>Selecciona un motivo</option>
                        <option value="productos">Información de productos</option>
                        <option value="pedidos">Consulta sobre pedidos</option>
                        <option value="sugerencia">Sugerencia</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div>
                    <label for="mensaje" class="mb-2 block text-sm font-semibold text-slate-700">
                        Mensaje
                    </label>
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        rows="5"
                        required
                        class="w-full resize-y rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-200"></textarea>
                </div>

                <div class="flex items-start gap-3">
                    <input
                        id="aceptaPrivacidad"
                        name="aceptaPrivacidad"
                        type="checkbox"
                        value="si"
                        required
                        class="mt-1 h-4 w-4 rounded border-slate-300 accent-orange-600">
                    <label for="aceptaPrivacidad" class="text-sm leading-6 text-slate-700">
                        Confirmo que he leído el aviso de privacidad y acepto que se utilicen mis datos para responder a esta consulta.
                    </label>
                </div>

                <button type="submit" class="w-full rounded-xl bg-orange-600 px-5 py-3 font-bold text-white transition hover:bg-orange-700">
                    Validar formulario
                </button>
                <p id="mensajeFormulario" class="hidden rounded-xl border px-4 py-3 text-sm leading-6" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="border-t border-orange-100 bg-white px-4 py-5 transition-colors duration-300">
        <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-3 text-center text-sm text-slate-600 sm:flex-row sm:text-left">
            <p>© 2026 Frutería del Día</p>
            <a href="mailto:info@fruteria.com" class="font-medium text-orange-800 underline hover:text-orange-950">info@fruteria.com</a>
            <a href="index.html" class="font-medium text-orange-800 hover:underline">Volver al inicio</a>
        </div>
    </footer>
    <script src="js/app.js" defer></script>
</body>
</html>
